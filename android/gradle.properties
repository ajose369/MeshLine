android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official

# Set to true to skip the cargo-ndk build and use whatever .so files are already
# in src/main/jniLibs. Useful on CI images without a Rust toolchain; never set it
# for a release build, or the APK can ship a stale native core.
meshline.skipRustBuild=false
