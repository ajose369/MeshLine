[package]
name = "meshline-ffi"
version = "0.1.0"
edition = "2021"
authors = ["MeshLine Team"]
description = "C / JNI FFI bindings for meshline-core on Android"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
meshline-core = { path = "../meshline-core" }
jni = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
ed25519-dalek = "2.1"
